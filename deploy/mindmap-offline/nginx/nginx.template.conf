# Windows nginx runtime template.
# scripts/deploy.ps1 replaces {{WEB_PORT}} and {{API_PORT}}
# and writes the result to nginx/nginx.runtime.conf.
#
# All paths are relative to the nginx prefix (runtimes/nginx) or to this
# config file's directory. Do not use absolute paths here: the nginx Windows
# build converts absolute paths to 8.3 short names and can fail to open them.
#
# Prefix: <package>/runtimes/nginx
#   ../../logs       -> <package>/logs
#   ../../web        -> <package>/web
#   include path     -> <package>/nginx/../runtimes/nginx/conf/mime.types

worker_processes  1;
error_log  ../../logs/nginx-error.log warn;
pid        ../../logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       ../runtimes/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  ../../logs/nginx-access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Bind all interfaces (0.0.0.0) so LAN clients can reach it.
        listen       0.0.0.0:{{WEB_PORT}};
        server_name  _;

        root   ../../web;
        index  index.html;

        # AI streaming endpoint: buffering must stay off for SSE.
        location = /api/ai/chat {
            proxy_pass http://127.0.0.1:{{API_PORT}};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:{{API_PORT}};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:{{API_PORT}};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Collaboration WebSocket. The frontend connects to same-origin /ws.
        location /ws {
            proxy_pass http://127.0.0.1:{{API_PORT}};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
